/*
 * Shared phone/Wear release signing policy.
 *
 * A private sideload must be requested explicitly with
 * T1ARC_PRIVATE_TEST_BUILD=1. Supplying all four T1ARC_RELEASE_* environment
 * variables switches every Android module to the same production certificate.
 * Store bundles always require that production configuration.
 */
def signingEnvironment = [
  storeFile: System.getenv('T1ARC_RELEASE_STORE_FILE'),
  storePassword: System.getenv('T1ARC_RELEASE_STORE_PASSWORD'),
  keyAlias: System.getenv('T1ARC_RELEASE_KEY_ALIAS'),
  keyPassword: System.getenv('T1ARC_RELEASE_KEY_PASSWORD'),
]
def suppliedSigningValues = signingEnvironment.values().count {
  it != null && !it.trim().isEmpty()
}
if (suppliedSigningValues > 0 && suppliedSigningValues < signingEnvironment.size()) {
  throw new GradleException(
    'T1 Arc production signing is incomplete. Supply all four T1ARC_RELEASE_* environment variables.'
  )
}

def productionSigningConfigured =
  suppliedSigningValues == signingEnvironment.size()
def privateTestBuildRequested =
  System.getenv('T1ARC_PRIVATE_TEST_BUILD') == '1' ||
  project.findProperty('t1ArcPrivateTestBuild')?.toString()?.toBoolean() == true
def productionStore = productionSigningConfigured
  ? rootProject.file(signingEnvironment.storeFile)
  : null
if (productionStore != null && !productionStore.isFile()) {
  throw new GradleException(
    'T1ARC_RELEASE_STORE_FILE does not point to a readable keystore.'
  )
}

ext.t1ArcProductionSigningConfigured = productionSigningConfigured
ext.t1ArcProductionStoreFile = productionStore
ext.t1ArcProductionStorePassword = signingEnvironment.storePassword
ext.t1ArcProductionKeyAlias = signingEnvironment.keyAlias
ext.t1ArcProductionKeyPassword = signingEnvironment.keyPassword
ext.t1ArcPrivateTestBuildRequested = privateTestBuildRequested

if (productionSigningConfigured && privateTestBuildRequested) {
  throw new GradleException(
    'T1 Arc production signing and private-test mode are mutually exclusive.'
  )
}

apply from: rootProject.file('../scripts/gradle/t1arc-application-id.gradle')

gradle.taskGraph.whenReady { graph ->
  def releaseArtifactTaskName = { taskName ->
    taskName ==~ /(?i)(assemble|package|install|bundle).*release$/ ||
      taskName ==~ /(?i)(publish|sign).*release.*/
  }
  def storePublicationTaskName = { taskName ->
    taskName ==~ /(?i)bundle.*release$/ ||
      taskName ==~ /(?i)(publish|sign).*release.*bundle.*/
  }
  def releaseArtifactRequested = graph.allTasks.any { task ->
    task.project == project &&
      releaseArtifactTaskName(task.name)
  }
  def storePublicationRequested = graph.allTasks.any { task ->
    task.project == project &&
      storePublicationTaskName(task.name)
  }
  if (storePublicationRequested && !project.ext.t1ArcProductionSigningConfigured) {
    throw new GradleException(
      'T1 Arc refuses to create a store bundle with the private test certificate. Configure the T1ARC_RELEASE_* environment variables first.'
    )
  }
  if (
    releaseArtifactRequested &&
    !project.ext.t1ArcProductionSigningConfigured &&
    !project.ext.t1ArcPrivateTestBuildRequested
  ) {
    throw new GradleException(
      'T1 Arc refuses an implicitly debug-signed release APK. Set T1ARC_PRIVATE_TEST_BUILD=1 only for an intentional private sideload, or configure the T1ARC_RELEASE_* production key.'
    )
  }
}
