version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-runtime:
        patterns:
          - expo
          - "expo-*"
          - "@expo/*"
      test-and-lint:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /services/tarvis-enrollment
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
