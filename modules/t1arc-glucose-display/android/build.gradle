plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.gregorgregor25.t1arc.glucosedisplay'
version = '0.1.0'

android {
  namespace "io.github.gregorgregor25.t1arc.glucosedisplay"
  sourceSets.main.java.srcDir('../../../wear/shared/src/main/java')
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.car.app:app:1.7.0"
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.media:media:1.8.0"
  implementation "com.google.android.gms:play-services-wearable:20.0.1"
  implementation "androidx.wear:wear-remote-interactions:1.2.0"
  implementation "androidx.concurrent:concurrent-futures:1.3.0"
  // Car exposes Guava only at runtime. RemoteActivityHelper also needs its API
  // on this module's compile classpath; pin the maintained Android artifact.
  implementation "com.google.guava:guava:33.7.1-android"
  implementation "com.facebook.react:react-android"
  testImplementation "junit:junit:4.13.2"
}
