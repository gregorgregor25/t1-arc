plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.daymark.glucosedisplay'
version = '0.1.0'

android {
  namespace "app.daymark.glucosedisplay"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "com.facebook.react:react-android"
}
