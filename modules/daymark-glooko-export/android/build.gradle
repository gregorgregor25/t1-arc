plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.daymark.glooko'
version = '0.1.0'

android {
  namespace "app.daymark.glooko"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
  testImplementation 'junit:junit:4.13.2'
}
