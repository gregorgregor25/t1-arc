plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.gregorgregor25.t1arc.communityreminder'
version = '0.1.0'

android {
  namespace 'io.github.gregorgregor25.t1arc.communityreminder'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  testImplementation 'junit:junit:4.13.2'
}
