plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

def installerEnabled = System.getenv('T1ARC_WATCH_INSTALLER') == '1'
group = 'io.github.gregorgregor25.t1arc.watchinstaller'
version = '0.1.0'

android {
    namespace 'io.github.gregorgregor25.t1arc.watchinstaller'
    defaultConfig { versionCode 1; versionName '0.1.0' }
    sourceSets.main.java.srcDirs = [installerEnabled ? 'src/enabled/java' : 'src/disabled/java']
    sourceSets.main.manifest.srcFile(installerEnabled ? 'src/enabled/AndroidManifest.xml' : 'src/disabled/AndroidManifest.xml')
    sourceSets.main.assets.srcDirs = installerEnabled ? ['src/enabled/assets'] : []
    sourceSets.test.java.srcDirs = installerEnabled ? ['src/enabledTest/java'] : []
}

dependencies {
    if (installerEnabled) {
        implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
        implementation 'org.conscrypt:conscrypt-android:2.7.0'
        implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    }
    testImplementation 'junit:junit:4.13.2'
}

gradle.taskGraph.whenReady { graph ->
    if (installerEnabled && graph.allTasks.any {
        it.project.plugins.hasPlugin('com.android.application') && it.name ==~ /(?i)bundle.*release/
    }) {
        throw new GradleException('Disable T1ARC_WATCH_INSTALLER before building Play bundles.')
    }
}
