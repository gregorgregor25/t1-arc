plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply from: rootProject.file('../scripts/gradle/t1arc-signing.gradle')
apply from: rootProject.file('../scripts/gradle/t1arc-watchface-catalog.gradle')

android {
    namespace 'io.github.gregorgregor25.t1arc.wear'
    compileSdk rootProject.ext.compileSdkVersion
    useLibrary 'wear-sdk', false
    sourceSets.main.java.srcDir('../shared/src/main/java')
    testBuildType 'release'

    defaultConfig {
        // Data Layer requires phone and watch package names and signatures to match.
        applicationId t1ArcWearCompanionApplicationId
        minSdk 30
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 6
        versionName '0.4.0'
        testInstrumentationRunner 'io.github.gregorgregor25.t1arc.wear.watchfaces.WatchFaceSmokeInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        debug {
            // Match the phone debug certificate: Wear Data Layer only connects
            // apps whose package name and signing certificate are identical.
            storeFile rootProject.file('app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (t1ArcProductionSigningConfigured) {
            production {
                storeFile t1ArcProductionStoreFile
                storePassword t1ArcProductionStorePassword
                keyAlias t1ArcProductionKeyAlias
                keyPassword t1ArcProductionKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix t1ArcDebugApplicationIdSuffix
            signingConfig signingConfigs.debug
        }
        release {
            if (t1ArcReleaseApplicationIdSuffix != null) {
                applicationIdSuffix t1ArcReleaseApplicationIdSuffix
            }
            // Private sideload builds continue to match the installed phone.
            // Production builds switch the whole suite to one protected key.
            signingConfig t1ArcProductionSigningConfigured
                ? signingConfigs.production
                : t1ArcPrivateTestBuildRequested
                    ? signingConfigs.debug
                    : null
        }
    }
}

dependencies {
    // 1.19.0 requires compileSdk 37 / AGP 9.1; Expo 57 currently pins 36 / 8.12.
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "com.google.android.gms:play-services-wearable:20.0.1"
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0"
    implementation "androidx.wear.tiles:tiles:1.6.1"
    implementation "androidx.wear.protolayout:protolayout:1.4.1"
    implementation "androidx.wear.protolayout:protolayout-material3:1.4.1"

    testImplementation "junit:junit:4.13.2"
}
