plugins {
    id 'com.android.application'
}

apply from: rootProject.file('../scripts/gradle/t1arc-signing.gradle')
apply from: rootProject.file('../scripts/gradle/t1arc-face-signing.gradle')
apply from: rootProject.file('../scripts/gradle/t1arc-watchface-provider.gradle')

android {
    namespace 'io.github.gregorgregor25.t1arc.watchface.summit'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId t1ArcWatchFaceApplicationId('summit')
        minSdk 33
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 3
        versionName '0.3.0'
    }

    signingConfigs {
        privateTest {
            storeFile rootProject.file('app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (t1ArcProductionSigningConfigured) {
            production {
                storeFile t1ArcFaceStoreFile
                storePassword t1ArcFaceStorePassword
                keyAlias t1ArcFaceKeyAlias
                keyPassword t1ArcFaceKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix t1ArcDebugApplicationIdSuffix
            minifyEnabled true
        }
        release {
            if (t1ArcReleaseApplicationIdSuffix != null) {
                applicationIdSuffix t1ArcReleaseApplicationIdSuffix
            }
            minifyEnabled true
            shrinkResources false
            signingConfig t1ArcProductionSigningConfigured
                ? signingConfigs.production
                : t1ArcPrivateTestBuildRequested
                    ? signingConfigs.privateTest
                    : null
        }
    }
}

apply from: rootProject.file('../scripts/gradle/t1arc-watchface-artwork.gradle')
